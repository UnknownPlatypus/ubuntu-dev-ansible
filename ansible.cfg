[defaults]
inventory = local.inventory
retry_files_enabled = False
result_format = yaml
# Pin the system python: it has python-apt and python-debian, so apt modules never need `respawn_module()`, which Mitogen breaks (mitogen-hq/mitogen#849)
interpreter_python = /usr/bin/python3
callback_plugins = ./callback_plugins
strategy_plugins = ./strategy_plugins
strategy = mitogen_linear
callbacks_enabled = ansible.builtin.default, changed_recap, ansible.posix.profile_tasks
callback_result_format = yaml
fact_caching=memory
verbosity = 1
