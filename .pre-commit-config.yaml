---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autoupdate_schedule: monthly
  skip:
    - dprint
    - ansible-lint

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/ansible/ansible-lint
    rev: 9bce2bfb8f4a984e6b13767bc0d6bf0a49492164  # frozen: v26.10.1
    hooks:
      - id: ansible-lint
        # Ansible refuses to run under a non-UTF-8 locale, which git GUIs and IDEs may set
        entry: env LC_ALL=C.UTF-8 python3 -m ansiblelint -v --force-color
  - repo: https://github.com/trim21/dprint-pre-commit
    rev: 1ecf0a59b6e0a73affcad2303fd2754a8993fddc  # frozen: v0.64.3.0
    hooks:
      - id: dprint
