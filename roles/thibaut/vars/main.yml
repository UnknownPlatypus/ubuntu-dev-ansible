---
thibaut_files: "{{ role_path }}/files"

thibaut_apt_packages:
  - caprine # Elegant Facebook Messenger desktop app
  - claude-desktop # Anthropic's Claude desktop app
  - curl # Command line tool for transferring data using various protocols
  - firefox-nightly # Nightly build of Firefox browser
  - git # Distributed version control system
  - gitlab-ci-local # Run GitLab CI pipelines locally
  - google-chrome-stable # Google Chrome web browser
  - hyperfine # Command-line benchmarking tool
  - jq # Lightweight command-line JSON processor
  - nginx # High-performance HTTP server and reverse proxy
  - ptyxis # GNOME's default terminal since 25.10, release upgrades keep gnome-terminal instead
  - pv # Pipe Viewer - monitors the progress of data through a pipeline
  - slack-desktop # Slack team chat
  - sourcegit # Fast, opensource Git GUI client
  - tailscale # Secure, easy-to-use VPN for building private networks
  - tmux # Terminal multiplexer
  - tree # Directory listing in tree-like format
  - wget # Retrieves files using HTTP, HTTPS, and FTP protocols
  - wl-clipboard # Wayland clipboard CLI (wl-copy/wl-paste), xclip doesn't work on Wayland

  # Build tools
  - build-essential # Informational list of build-essential packages
  - default-libmysqlclient-dev # MySQL database development files
  - gcc # GNU Compiler Collection
  - clang # Clang C, C++, and Objective-C compiler
  - pkg-config # Helper tool used when compiling applications and libraries

  # Geolibraries
  - binutils # GNU assembler, linker and binary utilities
  - gdal-bin # Geospatial Data Abstraction Library - Utility programs
  - libproj-dev # Cartographic Projections Library

  # GUI
  - foliate # Ebook reader
  # - spotify-client # Spotify music streaming client
  - vlc # Multimedia player and streamer

  # Docker
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Urls that always point to the latest release, `name` is the installed package name.
# Updates are only detected for urls redirecting to a versioned file, others are installed once.
thibaut_deb_packages:
  # Popular chat and voice communication platform for communities
  - name: discord
    url: https://discord.com/api/download?platform=linux&format=deb
  # Application to comfortably monitor your Internet traffic. Cross-platform, Intuitive, Reliable
  - name: sniffnet
    url: https://github.com/GyulyVGC/sniffnet/releases/latest/download/Sniffnet_LinuxDEB_amd64.deb
  # Valve's Steam gaming platform; the launcher sets up its own apt repo for updates (restored in apt_installs.yml)
  - name: steam-launcher
    url: https://repo.steampowered.com/steam/archive/stable/steam_latest.deb
  # The GUI for MongoDB
  - name: mongodb-compass
    url: https://compass.mongodb.com/api/v2/download/latest/compass/stable/linux_deb

# Use brew for packages that are lagging a lot behind in apt.
thibaut_brew_packages:
  - aoe # Terminal session manager for AI coding agents on Linux and macOS
  - awscli # Amazon AWS command-line interface (provides `aws`)
  - bacon # Background Rust code checker, keeps cargo check/clippy/test running on save
  - bat # Cat clone with syntax highlighting and Git integration
  - binsider # TUI to analyze ELF binaries
  - btop # Resource monitor that shows usage and stats for processor, memory, disks, network and processes
  - cargo-binstall # Install Rust binaries from prebuilt artifacts instead of compiling
  - cargo-nextest # Next-generation Rust test runner with per-test process isolation
  - codex # OpenAI coding agent CLI
  - dprint # Pluggable, configurable code formatter (JS/TS, JSON, Markdown, TOML, …)
  - dua-cli # View disk space usage and delete unwanted data, fast
  - dust # More intuitive version of du (disk usage)
  - eza # Modern replacement for ls
  - fd # Simple, fast and user-friendly alternative to find
  - fzf # General-purpose command-line fuzzy finder
  - gh # GitHub official CLI
  - git-cliff # A highly customizable Changelog Generator that follows Conventional Commit specifications
  - git-delta # Syntax-highlighting pager for git, diff, grep, and blame output
  - glow # Render markdown on the CLI
  - immich-go # Bulk upload photos and Google Takeout archives to an Immich server
  - lazydocker # A simple terminal UI for both docker and docker-compose
  - lazygit # A simple terminal UI for git commands
  - lychee # Fast, async, stream-based link checker
  - opencode # AI coding agent built for the terminal
  - oxipng # Multithreaded PNG optimizer
  - pandoc # Universal document converter
  - podman # Daemonless container engine for managing OCI containers and pods
  - sd # Intuitive find & replace CLI
  - taplo # TOML toolkit
  - tokei # Code statistics tool
  - tlrc # tl;dr pages client (simplified man pages)
  - typos-cli # Source code spell checker
  - ripgrep # Recursively searches directories for a regex pattern
  - rip2 # A rust-based rm with a focus on safety, ergonomics, and performance
  - samply # A sampling CPU profiler. See https://github.com/astral-sh/uv/issues/10344
  - xh # Friendly and fast HTTP client, HTTPie syntax in a single Rust binary
  - zoxide # A smarter cd command that ranks directories by frecency

# Tools distributed via an official shell installer.
thibaut_script_installs:
  - name: uv # Extremely fast Python package & project manager (Astral)
    url: https://astral.sh/uv/install.sh
    sha256: d79d834572b5b5cdd521289c055adcdbacd43bfe9e6b896445f351075dac4113
    update_cmd: uv self update
  - name: claude # Anthropic's agentic coding tool
    url: https://claude.ai/install.sh
    sha256: 005ec1a937f32dfbb74f9e810287bcb12cba2d5cae4c9277aa8c6364adbf1787
    update_cmd: claude update
  - name: zed # High-performance, multiplayer code editor
    url: https://zed.dev/install.sh
    sha256: 0fba83da4b7ea9ce7e2f042037b8e7ffdb7def73953bba0cd066d870a7ed51c3
  - name: herdr # Agent-aware terminal multiplexer, runs coding agents in tabs and panes
    url: https://herdr.dev/install.sh
    sha256: 3db3af8375006e193a393b5e3129feb237f30bc6f053fffbe1dc75da1f3d9ac4
  - name: atuin # Magical shell history with sync and fuzzy search
    url: https://setup.atuin.sh
    sha256: 3e709edea36c6bccfaa19d9ba82c53323da41dd2e8eb05509682c9a60f939bd4
    bin_dir: .atuin/bin
    args: --non-interactive
    post_install_script: atuin import auto
    update_cmd: atuin update

thibaut_uv_tools:
  - name: astpretty # Pretty print the output of python stdlib ast.parse
  - name: all-repos # Clone all your repositories and apply sweeping changes
  - name: auditwheel # Auditing and repairing wheels for PyPI
  - name: djade # A Django template formatter.
  - name: djangofmt # A fast, HTML aware, Django template formatter, written in Rust.
  - name: django-upgrade # Automatically upgrade your Django project code (UnknownPlatypus fork, poc/additional-fixers branch)
    source: git+https://github.com/UnknownPlatypus/django-upgrade@poc/additional-fixers
  - name: deptry # Command line tool to check for unused, missing and transitive dependencies in a Python project
  - name: dolphie # Your single pane of glass for real-time analytics into MySQL/MariaDB & ProxySQL
  - name: awsebcli # Command Line Interface for AWS Elastic Beanstalk
  - name: gh-profiler # Examine a GitHub user's profile, to help quickly decide how much to invest in their contributions
  - name: hatch # Modern, extensible Python project management
  - name: ipython # Enhanced interactive Python shell
  - name: jpegoptim-py # Python wrapper for jpegoptim
  - name: keyring # Easy way to access the system keyring service from python
  - name: magic-wormhole # Securely share files and folders with others
  - name: maturin # Build and publish crates with pyo3, cffi and uniffi bindings as well as rust binaries as python packages
  - name: norwegianblue # Python interface to endoflife.date to show end-of-life dates for a number of products.
  - name: posting # The modern API client that lives in your terminal.
  - name: pre-commit-mirror-maker # Scripts for creating mirror repositories that do not have .pre-commit-hooks.yaml
  - name: pyinstrument # Sampling profiler for Python programs
  - name: recoverpy # Interactively find and recover deleted or overwritten files from your terminal
  - name: ruff # An extremely fast Python linter, written in Rust
  - name: shellcheck-py # Python wrapper for ShellCheck, a static analysis tool for shell scripts
  - name: ty # An extremely fast Python type checker and language server (Astral)
  - name: yt-dlp[default] # Fork of youtube-dl with additional features and fixes
  - name: pre-commit # Framework for managing and maintaining multi-language pre-commit hooks
    with:
      - pre-commit-uv # uv plugin for pre-commit
  - name: rust-just # A handy command runner
  - name: tox # Generic virtual environment management and test command line tool
    with:
      - tox-uv # uv plugin for tox

# Bash completions to generate into ~/.local/share/bash-completion/completions/<name>
# `name` must match the binary being completed (that's what bash-completion looks up).
thibaut_bash_completions:
  - name: just
    command: just --completions bash
  - name: uv
    command: uv generate-shell-completion bash
  - name: ruff
    command: ruff generate-shell-completion bash
  - name: rustup
    command: rustup completions bash
  - name: rg
    command: rg --generate complete-bash
  - name: glow
    command: glow completion bash
  - name: podman
    command: podman completion bash
  - name: docker
    command: docker completion bash
  - name: djangofmt
    command: djangofmt completions bash

# Dock pins, enforced on every run. Globs match JetBrains Toolbox launchers, which embed a per-install id.
thibaut_dock_favorites:
  - org.gnome.Nautilus.desktop
  - slack.desktop
  - jetbrains-pycharm-*.desktop
  - sourcegit.desktop
  - org.gnome.Ptyxis.desktop
  - spotify.desktop
  - firefox-nightly.desktop
  - jetbrains-rustrover-*.desktop
  - dev.zed.Zed.desktop
