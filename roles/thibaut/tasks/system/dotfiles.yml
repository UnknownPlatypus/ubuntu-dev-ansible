---
# `files/home/` mirrors ~, the copy creates missing parent dirs.
- name: Copy dotfiles and custom scripts
  ansible.builtin.copy:
    src: home/
    dest: ~/
    mode: "0755"

- name: Update ~/.bashrc for various tools
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    create: true
    mode: "0644"
    block: |
      eval "$(zoxide init bash)"
      eval "$(fzf --bash)"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: tools"
    prepend_newline: true
    append_newline: true

- name: Create ~/.claude
  ansible.builtin.file:
    path: ~/.claude
    state: directory
    mode: "0755"

# Claude Code is a disgusting piece os software actively harming standard for no reason.
# Unlike codex that uses the standard `AGENTS.md`, it needs a proprietary `CLAUDE.md`.
- name: Create `CLAUDE.md` -> `AGENTS.md` symlink
  ansible.builtin.file:
    src: ~/.agents/AGENTS.md
    dest: ~/.claude/CLAUDE.md
    state: link
