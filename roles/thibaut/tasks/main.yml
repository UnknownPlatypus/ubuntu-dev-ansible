---
- name: Create ssh dir
  ansible.builtin.file:
    path: ~/.ssh
    state: directory
    mode: "0700"
  tags:
    - ssh

- name: Customize grub dual boot
  ansible.builtin.import_tasks: system/grub.yml
  tags:
    - grub

# Ubuntu ships fs.inotify.max_user_watches=65536 in /usr/lib/sysctl.d/30-localsearch.conf,
# but JetBrains IDEs recommand more for large projects.
# See https://youtrack.jetbrains.com/articles/SUPPORT-A-1715/Inotify-Watches-Limit-Linux
- name: Raise inotify watches limit for JetBrains IDEs
  become: true
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "1048576"
    sysctl_file: /etc/sysctl.d/idea.conf
    sysctl_set: true
    reload: true
  tags:
    - inotify

- name: Copy dotfiles
  ansible.builtin.import_tasks: system/dotfiles.yml
  tags:
    - dotfiles

- name: Install tools via apt/brew/uv/cargo
  ansible.builtin.import_tasks: installs.yml
  tags:
    - installs

- name: Load GNOME dconf settings
  ansible.builtin.import_tasks: system/gnome.yml
  tags:
    - gnome

- name: Clone my repos into ~/workspace
  ansible.builtin.import_tasks: all-repos.yml
  tags:
    - all-repos

- name: Self hosted LLM (Require `--tags llm` to be executed)
  ansible.builtin.import_tasks: llm.yml
  tags:
    - llm
    - never

- name: System cleanup
  ansible.builtin.import_tasks: system/cleanup.yml
  tags:
    - cleanup
