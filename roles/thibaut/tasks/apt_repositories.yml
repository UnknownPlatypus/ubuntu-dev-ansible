---
- name: Set thibaut_architecture to amd64 if x86_64
  ansible.builtin.set_fact:
    thibaut_architecture: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"

- name: Add google APT repository
  ansible.builtin.deb822_repository:
    name: google
    types: [deb]
    architectures: "{{ thibaut_architecture }}"
    uris: http://dl.google.com/linux/chrome/deb
    signed_by: https://dl.google.com/linux/linux_signing_key.pub
    suites: [stable]
    components: [main]
    enabled: true

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    architectures: "{{ thibaut_architecture }}"
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    suites: [
      "{{ ansible_facts['distribution_release'] | lower }}",
    ] # noble, focal, ...
    components: [stable]
    enabled: true

- name: Add Mozilla APT repository
  ansible.builtin.deb822_repository:
    name: mozilla
    types: [deb]
    architectures: "{{ thibaut_architecture }}"
    uris: https://packages.mozilla.org/apt
    signed_by: https://packages.mozilla.org/apt/repo-signing-key.gpg
    suites: [mozilla]
    components: [main]
    enabled: true

- name: Add Tailscale APT repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    architectures: "{{ thibaut_architecture }}"
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] | lower }}.noarmor.gpg"
    suites: ["{{ ansible_facts['distribution_release'] | lower }}"]
    components: [main]
    enabled: true

- name: Add caprine APT repository
  ansible.builtin.deb822_repository:
    name: caprine
    types: [deb]
    uris: "https://apt.fury.io/lefterisgar/"
    suites: ["*"]
    components: ["*"]
    enabled: true
    trusted: true

- name: Add SourceGit APT repository
  ansible.builtin.deb822_repository:
    name: sourcegit
    types: [deb]
    architectures: "{{ thibaut_architecture }}"
    uris: https://codeberg.org/api/packages/yataro/debian
    signed_by: https://codeberg.org/api/packages/yataro/debian/repository.key
    suites: [generic]
    components: [main]
    enabled: true

- name: Get enabled dpkg foreign architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: thibaut_foreign_architectures
  changed_when: false

- name: Enable i386 multiarch (required for Steam 32-bit libraries)
  ansible.builtin.command: dpkg --add-architecture i386
  changed_when: true
  register: thibaut_i386_enabled
  when: "'i386' not in thibaut_foreign_architectures.stdout_lines"
