---
# all-repos-* commands read these from ~.
- name: Update all-repos config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: ~/{{ item }}
    mode: "0600"
  loop:
    - all-repos.json
    - my-repos.json

# `update: false` never touches existing clones, false positive: https://github.com/ansible/ansible-lint/issues/5217
- name: Clone missing repos into ~/workspace # noqa: latest[git]
  ansible.builtin.git:
    repo: "{{ item.value }}"
    dest: ~/workspace/{{ item.key }}
    update: false
  loop: "{{ lookup('file', 'my-repos.json') | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
