---
- name: Setup, install and cleanup apt packages
  ansible.builtin.import_tasks: apt_installs.yml
  tags:
    - apt

- name: Install linuxbrew
  ansible.builtin.include_role:
    name: markosamuli.linuxbrew
    apply:
      tags:
        - brew
  vars:
    linuxbrew_use_installer: true
  tags:
    - brew

- name: Install & upgrade brew packages
  community.general.homebrew:
    name: "{{ thibaut_brew_packages }}"
    state: latest
    update_homebrew: true
  tags:
    - brew

# btop needs perfmon to read Intel GPU stats, brew upgrades replace the binary and drop it.
- name: Resolve btop binary
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/btop
  register: thibaut_btop
  tags:
    - brew

- name: Grant btop perfmon capability
  community.general.capabilities:
    path: "{{ thibaut_btop.stat.lnk_source }}"
    capability: cap_perfmon+ep
  become: true
  tags:
    - brew

- name: Bootstrap tools that ship an install.sh (uv, atuin, Claude Code, Zed)
  ansible.builtin.include_tasks: packages/script_install.yml
  loop: "{{ thibaut_script_installs }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - script-installs

# atuin installer writes a plain `eval "$(atuin init bash)"` to ~/.bashrc.
# We need to fix it to add one with `--disable-up-arrow`
- name: Disable the up-arrow binding in atuin's bash init line
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    regexp: "atuin init bash"
    line: 'eval "$(atuin init bash --disable-up-arrow)"'
  tags:
    - atuin

- name: Install JetBrains Toolbox
  ansible.builtin.import_tasks: packages/jetbrains-toolbox.yml
  tags:
    - jetbrains

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  become: true
  tags:
    - podman

- name: Install & upgrade Podman Desktop
  community.general.flatpak:
    name: io.podman_desktop.PodmanDesktop
    state: latest
  become: true
  tags:
    - podman

# Podman Desktop used to be a tarball in /opt, drop once every machine is migrated.
- name: Remove the old Podman Desktop tarball install
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/podman-desktop
    - /usr/share/applications/podman-desktop.desktop
  become: true
  tags:
    - podman

# The docker-ce package already creates the group and enables its services.
# https://docs.docker.com/engine/install/linux-postinstall/
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['env'].USER }}"
    groups: docker
    append: true
  become: true
  tags:
    - docker

- name: Install Rust stable and nightly with rustup
  ansible.builtin.command: rustup install stable nightly
  register: thibaut_rustup_install_output
  changed_when: "'unchanged' not in thibaut_rustup_install_output.stdout"
  tags:
    - rust

- name: Install & upgrade Rust CLIs with cargo-binstall
  ansible.builtin.command: >
    cargo binstall --no-confirm --disable-strategies compile
    {{ thibaut_cargo_binstall_crates | join(' ') }}
  register: thibaut_cargo_binstall
  changed_when: "'will install' in thibaut_cargo_binstall.stdout"
  tags:
    - rust

- name: Uv install latest Pythons
  ansible.builtin.command: >
    uv python install
    3.11
    3.12
    3.13
    3.14
    3.14t
    3.15
    3.15t
  register: thibaut_uv_python_install
  changed_when: "'Downloaded' in thibaut_uv_python_install.stderr"
  tags:
    - uv

- name: Uv install tools
  ansible.builtin.command: >
    uv tool install
    --python 3.12
    {{ item.source | default(item.name) }}
    {% if item.with is defined %}
    {% for w in item.with %}--with {{ w }}{% endfor %}
    {% endif %}
  loop: "{{ thibaut_uv_tools }}"
  register: thibaut_uv_tool_install
  changed_when: thibaut_uv_tool_install.stderr is search('^ [+-] ', multiline=True)
  tags:
    - uv

# Also upgrades the `with` packages.
- name: Uv upgrade tools
  ansible.builtin.command: uv tool upgrade --all
  register: thibaut_uv_upgrade
  changed_when: "'Nothing to upgrade' not in thibaut_uv_upgrade.stderr"
  tags:
    - uv

- name: Ensure user bash-completion dir exists
  ansible.builtin.file:
    path: ~/.local/share/bash-completion/completions
    state: directory
    mode: "0755"
  tags:
    - bash-completions

- name: Generate bash completions (stdout)
  ansible.builtin.command: "{{ item.command }}"
  register: thibaut_completion_output
  changed_when: false
  no_log: true
  loop: "{{ thibaut_bash_completions }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - bash-completions

- name: Write bash completions
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "~/.local/share/bash-completion/completions/{{ item.item.name }}"
    mode: "0644"
  no_log: true
  loop: "{{ thibaut_completion_output.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - bash-completions

# Last, so every install (bun included) has run before it.
- name: Update global agent skills
  ansible.builtin.command: bunx skills update -g
  register: thibaut_skills_update
  changed_when: "'up to date' not in thibaut_skills_update.stderr"
  tags:
    - skills
